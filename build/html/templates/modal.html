
<div class="modal-custom-overlay" id="modal-location" style="display: none;">
  <div class="modal-custom-card">
    <div class="modal-custom-header">
      <h4>Agregar Ubicación</h4>
      <button class="modal-custom-close" id="btn-modal-close" type="button" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal-custom-body">
      <p>Ingresa el nombre de un país para actualizar el clima de sus ciudades principales:</p>
      <div class="modal-input-group">
        <input class="modal-custom-input" id="input-country" type="text" placeholder="Ej: Colombia, España, Francia, México, EE. UU..." autocomplete="off"/>
      </div>
      <p class="modal-error-msg" id="modal-error-msg"></p>
    </div>
    <div class="modal-custom-footer">
      <button class="btn-modal-action btn-cancel" id="btn-modal-cancel" type="button">Cancelar</button>
      <button class="btn-modal-action btn-accept" id="btn-modal-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
